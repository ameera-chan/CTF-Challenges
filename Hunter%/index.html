<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101a13">
  <!-- Debug console at /console -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 64 64%22><rect width=%2264%22 height=%2264%22 rx=%2212%22 fill=%22%23101a13%22/><path d=%22M10 30c0-12 11-19 25-19 10 0 18 4 22 12l5 2-5 7v10H46v8h-8v-8H23v8h-8v-9c-4-3-5-7-5-11Z%22 fill=%22%23dce9ca%22/></svg>">
  <title>Hunter% — Trophy Records</title>
  <style>
    :root {
      --sans: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      color: #f6f2e8;
      background-color: #101a13;
      background-image:
        radial-gradient(circle at 16% 10%, rgba(91, 126, 80, 0.18), transparent 26rem),
        radial-gradient(circle at 82% 22%, rgba(129, 83, 48, 0.13), transparent 24rem);
      background-attachment: fixed;
      font-family: var(--sans);
    }
    .site-shell { width: min(1180px, calc(100% - 40px)); margin: 0 auto; }
    .hero { display: flex; min-height: 100svh; align-items: center; justify-content: center; text-align: center; }
    .hero__content { max-width: 680px; padding: 80px 0 96px; margin: 0 auto; }
    h1 { margin: 0; font-size: clamp(2.5rem, 4vw, 3.5rem); font-weight: 600; line-height: 1.1; letter-spacing: -0.02em; }
    .hero__subtitle { max-width: 600px; margin: 16px auto 0; color: #e2e8f0; font-size: clamp(0.9rem, 1.2vw, 1rem); line-height: 1.6; }
    .hero__actions { display: flex; align-items: center; justify-content: center; gap: 12px; margin-top: 32px; flex-wrap: wrap; }
    .boars-button, .nav-link {
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      min-width: 120px; min-height: 40px; padding: 0 16px; border-radius: 4px;
      font-size: 0.875rem; font-weight: 600; text-decoration: none; cursor: pointer;
      transition: transform 160ms ease, background 160ms ease;
    }
    .boars-button { border: 1px solid #bfd1af; color: #162117; background: #dce9ca; }
    .boars-button:hover { background: #ecf5dc; transform: translateY(-2px); }
    .nav-link--secondary { background: rgba(255, 255, 255, 0.05); color: #dce9ca; border: 1px solid rgba(255, 255, 255, 0.1); }
    .nav-link--secondary:hover { background: rgba(255, 255, 255, 0.1); color: #fff; transform: translateY(-2px); }
    svg { width: 16px; height: 16px; fill: currentColor; }
  </style>
</head>
<body>
  <main>
    <section class="hero site-shell">
      <div class="hero__content">
        <h1>Hunter%</h1>
        <p class="hero__subtitle">The finest trophy records gathered under one roof.</p>
        <div class="hero__actions">
          <a href="boars.html" class="boars-button">
            <svg viewBox="0 0 64 64" aria-hidden="true">
              <path d="M11 29c0-12 11-19 25-19 10 0 18 4 22 12l5 2-5 7v10H47v8h-8v-8H24v8h-8v-9c-4-3-5-7-5-11Zm36-7 2-8 7 8h-9Zm-4 7a3 3 0 1 0 0-6 3 3 0 0 0 0 6Z" />
            </svg>
            <span>Boars</span>
          </a>
          <a href="sighting.html" class="nav-link nav-link--secondary">Submit a Sighting</a>
        </div>
      </div>
    </section>
  </main>
</body>
</html>
