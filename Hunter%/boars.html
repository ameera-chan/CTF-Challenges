<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101a13">
  <title>Hunter% — Hunter Log</title>
  <style>
    :root {
      color-scheme: dark;
      --ink: #172018;
      --muted: #687269;
      --paper: #fffdf8;
      --paper-soft: #f2f0e8;
      --forest: #183c2a;
      --forest-bright: #276343;
      --moss: #b9d39f;
      --line: rgba(23, 32, 24, 0.16);
      --mono: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
      --sans: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      min-width: 320px;
      margin: 0;
      color: #f6f2e8;
      background:
        radial-gradient(circle at 16% 10%, rgba(91, 126, 80, 0.18), transparent 26rem),
        radial-gradient(circle at 82% 22%, rgba(129, 83, 48, 0.13), transparent 24rem),
        #101a13;
      font-family: var(--sans);
    }

    .site-shell {
      width: min(1180px, calc(100% - 40px));
      margin: 0 auto;
    }

    .nav-link--secondary {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-width: 120px;
      min-height: 40px;
      padding: 0 16px;
      border-radius: 4px;
      font-family: var(--sans);
      font-size: 0.875rem;
      font-weight: 600;
      text-decoration: none;
      cursor: pointer;
      transition: transform 160ms ease, opacity 160ms ease;
      background: rgba(255, 255, 255, 0.05);
      color: #dce9ca;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .nav-link--secondary:hover {
      background: rgba(255, 255, 255, 0.1);
      color: #fff;
      transform: translateY(-2px);
    }

    .results {
      color: var(--ink);
      background:
        linear-gradient(rgba(23, 32, 24, 0.035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(23, 32, 24, 0.035) 1px, transparent 1px),
        var(--paper-soft);
      background-size: 32px 32px;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      min-height: calc(100vh - 80px);
      /* Stretches the section to the bottom */
    }

    .results__inner {
      max-width: 1000px;
      padding: 60px 0 110px;
    }

    .results__header {
      display: flex;
      align-items: fill;
      justify-content: space-between;
      gap: 28px;
      margin-bottom: 38px;
    }

    .results__kicker {
      margin: 0;
      font-family: var(--sans);
      font-size: clamp(1.75rem, 4vw, 2.5rem);
      font-weight: 700;
      letter-spacing: -0.04em;
    }

    .boar-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 28px;
    }

    .boar-card {
      overflow: hidden;
      color: var(--ink);
      background: var(--paper);
      border: 1px solid rgba(23, 32, 24, 0.25);
      box-shadow: 10px 10px 0 rgba(24, 60, 42, 0.12);
      transition: transform 180ms ease, box-shadow 180ms ease;
      border-radius: 4px;
    }

    .boar-card:hover {
      box-shadow: 14px 14px 0 rgba(24, 60, 42, 0.16);
      transform: translate(-3px, -3px);
    }

    .boar-card__header {
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: center;
      min-height: 64px;
      padding: 0 24px;
      border-bottom: 1px solid var(--line);
    }

    .boar-card__header h3 {
      margin: 0;
      font-family: var(--sans);
      font-weight: 600;
      font-size: clamp(1rem, 2.1vw, 1.25rem);
      letter-spacing: -0.02em;
    }

    .boar-card__id {
      color: #6f776f;
      font-family: var(--sans);
      font-weight: 500;
      font-size: 0.85rem;
      letter-spacing: 0.04em;
    }

    .boar-card__image {
      display: grid;
      min-height: 250px;
      padding: 24px;
      place-items: center;
      background: radial-gradient(circle at 50% 70%, var(--glow), transparent 43%), #fbfaf6;
      border-bottom: 1px solid var(--line);
    }

    .boar-svg {
      width: min(100%, 460px);
      height: auto;
      overflow: visible;
      filter: drop-shadow(0 18px 13px rgba(23, 32, 24, 0.13));
    }

    .boar-photo {
      width: 100%;
      max-width: 460px;
      height: 250px;
      object-fit: cover;
      border-radius: 4px;
      border: 1px solid rgba(23, 32, 24, 0.18);
      box-shadow: 0 12px 18px rgba(23, 32, 24, 0.16);
    }

    .boar-svg .ground {
      fill: rgba(23, 32, 24, 0.1);
    }

    .boar-svg .fur {
      fill: var(--fur);
      stroke: var(--fur-dark);
      stroke-width: 5;
      stroke-linejoin: round;
    }

    .boar-svg .fur-dark {
      fill: var(--fur-dark);
    }

    .boar-svg .bristles {
      fill: none;
      stroke: var(--fur-dark);
      stroke-width: 10;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .boar-svg .muzzle {
      fill: var(--muzzle);
      stroke: var(--fur-dark);
      stroke-width: 4;
    }

    .boar-svg .tusk {
      fill: #fff1c9;
      stroke: #9b865c;
      stroke-width: 3;
    }

    .boar-svg .eye,
    .boar-svg .nostril {
      fill: #111713;
    }

    .boar-svg .highlight {
      fill: none;
      stroke: rgba(255, 255, 255, 0.22);
      stroke-width: 6;
      stroke-linecap: round;
    }

    .stats {
      padding: 16px 24px 20px;
    }

    .stats__row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(120px, 1fr);
      align-items: center;
      min-height: 40px;
      border-bottom: 1px solid var(--line);
    }

    .stats__row:last-child {
      border-bottom: 0;
    }

    .stats__row--head {
      min-height: 44px;
      font-family: var(--sans);
      font-size: 0.85rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .stats dt,
    .stats dd {
      margin: 0;
    }

    .stats dt {
      font-weight: 600;
      font-family: var(--sans);
      font-size: 0.9rem;
    }

    .stats dd {
      font-family: var(--sans);
      font-size: 0.9rem;
    }

    .stat-value {
      color: var(--accent);
      font-weight: 700;
    }

    .boar-card--forest {
      --accent: #367a47;
      --fur: #7b5439;
      --fur-dark: #3e2b21;
      --muzzle: #9e7860;
      --glow: rgba(118, 158, 93, 0.23);
    }

    .boar-card--mud {
      --accent: #94622d;
      --fur: #6a5141;
      --fur-dark: #302821;
      --muzzle: #8b7162;
      --glow: rgba(153, 111, 68, 0.22);
    }

    .boar-card--iron {
      --accent: #4f6f82;
      --fur: #5f6562;
      --fur-dark: #292e2d;
      --muzzle: #7d8580;
      --glow: rgba(80, 112, 130, 0.2);
    }

    .boar-card--thorn {
      --accent: #9c4936;
      --fur: #735142;
      --fur-dark: #362720;
      --muzzle: #987466;
      --glow: rgba(156, 73, 54, 0.2);
    }

    .results__message {
      grid-column: 1 / -1;
      margin: 0;
      padding: 24px;
      border: 1px solid rgba(23, 32, 24, 0.25);
      border-radius: 4px;
      color: #6e3429;
      background: var(--paper);
      font-family: var(--sans);
      font-weight: 500;
    }

    .variant-leaf {
      fill: #57804f;
      stroke: #315038;
      stroke-width: 3;
    }

    .variant-mud {
      fill: #664530;
      opacity: 0.72;
    }

    .variant-plate {
      fill: #728081;
      stroke: #3b4647;
      stroke-width: 4;
    }

    .variant-thorn {
      fill: #8b3e2f;
      stroke: #4e291f;
      stroke-width: 3;
    }

    @keyframes reveal {
      from {
        opacity: 0;
        transform: translateY(22px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .boar-card {
      animation: reveal 420ms both;
    }

    .boar-card:nth-child(2) {
      animation-delay: 70ms;
    }

    .boar-card:nth-child(3) {
      animation-delay: 140ms;
    }

    .boar-card:nth-child(4) {
      animation-delay: 210ms;
    }

    @media (max-width: 780px) {
      .site-shell {
        width: min(100% - 24px, 590px);
      }

      .boar-grid {
        grid-template-columns: 1fr;
      }

      .results__inner {
        padding: 40px 0 82px;
      }
    }
  </style>
</head>
