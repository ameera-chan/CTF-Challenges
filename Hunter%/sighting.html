<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101a13">
  <title>Hunter% — Submit a Sighting</title>
  <style>
    :root {
      color-scheme: dark;
      --ink: #172018;
      --muted: #687269;
      --paper: #fffdf8;
      --paper-soft: #f2f0e8;
      --forest: #183c2a;
      --forest-bright: #276343;
      --moss: #b9d39f;
      --line: rgba(23, 32, 24, 0.16);
      --mono: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
      --sans: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      min-width: 320px;
      margin: 0;
      color: #f6f2e8;
      background:
        radial-gradient(circle at 16% 10%, rgba(91, 126, 80, 0.18), transparent 26rem),
        radial-gradient(circle at 82% 22%, rgba(129, 83, 48, 0.13), transparent 24rem),
        #101a13;
      font-family: var(--sans);
    }

    .site-shell {
      width: min(1180px, calc(100% - 40px));
      margin: 0 auto;
    }

    .nav-link--secondary {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-width: 120px;
      min-height: 40px;
      padding: 0 16px;
      border-radius: 4px;
      font-family: var(--sans);
      font-size: 0.875rem;
      font-weight: 600;
      text-decoration: none;
      cursor: pointer;
      transition: transform 160ms ease, opacity 160ms ease;
      background: rgba(255, 255, 255, 0.05);
      color: #dce9ca;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .nav-link--secondary:hover {
      background: rgba(255, 255, 255, 0.1);
      color: #fff;
      transform: translateY(-2px);
    }

    .boars-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-width: 120px;
      min-height: 40px;
      padding: 0 16px;
      border: 1px solid #bfd1af;
      border-radius: 4px;
      color: #162117;
      background: #dce9ca;
      font-family: var(--sans);
      font-size: 0.875rem;
      font-weight: 600;
      letter-spacing: normal;
      text-transform: none;
      text-decoration: none;
      cursor: pointer;
      transition: transform 160ms ease, opacity 160ms ease;
    }

    .boars-button:hover {
      background: #ecf5dc;
      color: #162117;
      transform: translateY(-2px);
    }

    .boars-button:disabled {
      cursor: wait;
      opacity: 0.72;
      transform: none;
    }

    .sighting-section {
      color: var(--ink);
      background:
        linear-gradient(rgba(23, 32, 24, 0.035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(23, 32, 24, 0.035) 1px, transparent 1px),
        var(--paper-soft);
      background-size: 32px 32px;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      min-height: calc(100vh - 80px);
      /* Stretches the section to the bottom */
    }

    .sighting__inner {
      max-width: 1000px;
      padding: 60px 0 110px;
    }

    .sighting__header {
      display: flex;
      align-items: fill;
      justify-content: space-between;
      gap: 28px;
      margin-bottom: 38px;
    }

    .sighting__kicker {
      margin: 0;
      font-family: var(--sans);
      font-size: clamp(1.75rem, 4vw, 2.5rem);
      font-weight: 700;
      letter-spacing: -0.04em;
    }

    .sighting-card {
      background: var(--paper);
      border: 1px solid rgba(23, 32, 24, 0.25);
      box-shadow: 10px 10px 0 rgba(24, 60, 42, 0.12);
      padding: 36px;
      max-width: 680px;
    }

    .sighting-form {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
      text-align: left;
    }

    .form-group label {
      font-family: var(--sans);
      font-weight: 600;
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .form-group input {
      padding: 12px 16px;
      border: 1px solid var(--line);
      background: #fbfaf6;
      color: var(--ink);
      font-family: var(--sans);
      font-size: 0.95rem;
      border-radius: 4px;
    }

    .form-group input:focus {
      outline: 2px solid var(--forest-bright);
    }

    .preview-output {
      margin-top: 24px;
      padding: 18px;
      background: var(--ink);
      color: var(--moss);
      font-family: var(--mono);
      font-size: 0.85rem;
      white-space: pre-wrap;
      word-break: break-all;
      border: 1px solid rgba(0, 0, 0, 0.5);
      border-radius: 4px;
    }

    .preview-output[hidden] {
      display: none;
    }

    @media (max-width: 780px) {
      .site-shell {
        width: min(100% - 24px, 590px);
      }

      .sighting__inner {
        padding: 40px 0 82px;
      }
    }
  </style>
</head>

<body>
  <div style="padding: 20px 0;" class="site-shell">
    <a href="/" class="nav-link--secondary">← Back</a>
  </div>

  <section class="sighting-section">
    <div class="sighting__inner site-shell">
      <div class="sighting__header">
        <div>
          <h2 class="sighting__kicker">Submit a Sighting</h2>
        </div>
      </div>
      <div class="sighting-card">
        <form class="sighting-form" id="sighting-form">
          <div class="form-group">
            <label for="photo-url">Photo URL</label>
            <input type="url" id="photo-url" name="imageUrl" placeholder="https://example.com/boar.jpg" required>
          </div>
          <button type="submit" class="boars-button" style="margin: 0; width: 100%;">Preview</button>
        </form>
        <pre class="preview-output" id="preview-output" hidden></pre>
      </div>
    </div>
  </section>

</html>
